<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="같은 색끼리 모으는 정리 퍼즐. APDO STUDIO.">
  <meta name="theme-color" content="#4F7CFF">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="정리 퍼즐">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>정리 퍼즐 · APDO STUDIO</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 로딩 중에도 빈 흰 화면을 보여주지 않는다. 배경색과 안내 문구를 미리 깐다. */
    html, body { margin: 0; padding: 0; height: 100%; background: #FAFAFC; }
    @media (prefers-color-scheme: dark) { html, body { background: #131417; } }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: #8A909B; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="boot">불러오는 중…</div>
  <script>
    // 🔴 이전 배포가 등록해 둔 서비스워커를 지운다.
    //
    // 왜 이게 있나: 투자자가 "지루하다"고 판정한 뒤 게임을 고쳤는데,
    // 브라우저에 남아 있던 서비스워커가 옛 화면을 계속 보여줄 수 있었다.
    // 새로고침을 해도 옛것이 뜨면 우리는 고친 것을 판정받지 못한다.
    // 시험판 동안에는 캐시보다 "항상 최신"이 중요하다.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    }

    // Flutter가 첫 프레임을 그리면 안내 문구를 지운다.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
